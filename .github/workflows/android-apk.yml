# Builds an installable Android APK on GitHub's servers (no Expo account needed).
# Runs on every push to the partyspellen branch (or main, if the app moves to
# its own repo). The APK appears under the run's "Artifacts".
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, partyspellen]

permissions:
  contents: write   # needed to publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Generates the android/ folder from app.json (Continuous Native Generation).
      - run: npx expo prebuild --platform android --no-install

      # Release build. Expo's template signs it with the debug key, which is
      # fine for installing on your own phones (not for the Play Store).
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk partyspellen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: partyspellen-apk
          path: partyspellen.apk

      # Public download that needs no GitHub sign-in. The newest build is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/partyspellen.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="partyspellen-v1.0.${{ github.run_number }}"
          gh release create "$TAG" partyspellen.apk \
            --target "${{ github.sha }}" \
            --title "Partyspellen build ${{ github.run_number }}" \
            --notes "Android APK: Imposter en 30 Seconds. Open deze link op je telefoon en installeer." \
            --latest
